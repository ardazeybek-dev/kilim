[package]
name = "kilim"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "A tiny sequence CRDT (RGA) for conflict-free collaborative text editing, with first-class WebAssembly bindings."
license = "MIT"
repository = "https://github.com/ardazeybek-dev/kilim"
homepage = "https://ardazeybek-dev.github.io/kilim/"
readme = "README.md"
keywords = ["crdt", "collaboration", "wasm", "local-first", "text"]
categories = ["data-structures", "text-editors", "wasm"]
exclude = ["demo/", "docker/", ".github/"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
